# Reference Nginx config for deploying DriveHub on a single VPS without
# Docker: Nginx serves the built frontend as static files and reverse
# proxies API/socket traffic to the PM2-managed backend process on
# localhost:5000. Adjust paths and server_name, then drop this in
# /etc/nginx/sites-available/drivehub and symlink it into sites-enabled.
#
# Build the frontend first with:
#   cd frontend && npm run build
# and point `root` below at the resulting dist/ directory.

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/drivehub/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Once this is working over plain HTTP, run `certbot --nginx -d your-domain.com`
# to provision a free TLS certificate and have Certbot rewrite this file
# for HTTPS automatically.
